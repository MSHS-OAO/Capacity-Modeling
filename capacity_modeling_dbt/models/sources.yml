version: 2

sources:  
  - name: datahub_ubs
    description: 'source for all USB schema tables owned by DTP'
    database: datahub_prod_ext_oci_ubs
    schema: ubs
    tables:
      - name: msx_ip_output
        description: 'raw table containing IP encounters for entire system'
      - name: msx_provider_v
        description: 'table of all providers, their credential IDs and their service areas'

  - name: datahub_dashbd_user
    description: 'source for all DASHBD_USER schema tables owned by DTP'
    database: datahub_prod_ext_oci_dashbd_user
    schema: dashbd_user
    tables:
      - name: oe_charge_detail
        description: 'system wide hospital billing table containing bed charges'

  - name: capacity_modeling
    description: 'source for all OAO owned capacity modeling tables'
    database: opsanalytics_adb_workspace01
    schema: capacity_modeling
    tables: 
      - name: service_groups
        description: 'historic tracking of all ip units and their unit types by date'
